<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Jasper Labs builds custom AI agents and automation for businesses — LLM integrations, autonomous agent systems, and workflow automation wired into the tools your team already uses." />
  <meta name="keywords"
    content="AI automation, AI agents, custom AI solutions, AI consulting, LLM integration, workflow automation, AI voice agent, business process automation" />
  <meta name="author" content="Jasper Labs" />
  <title>Jasper Labs — Custom AI Agents & Automation for Businesses</title>
  <link rel="icon" type="image/png" href="/assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['DM Sans', 'sans-serif'],
            display: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            jasper: {
              50: '#fdf2f2',
              100: '#fde6e6',
              200: '#fbd0d0',
              300: '#f8a9a9',
              400: '#f27676',
              500: '#e94545',
              600: '#d62525',
              700: '#b41a1a',
              800: '#951818',
              900: '#7c1a1a',
              950: '#430a0a',
            }
          }
        }
      }
    }
  </script>
  <style>
    html {
      scroll-behavior: smooth;
    }

    html, body {
      height: 100%;
      background-color: #ffffff;
      color: #000000;
    }

    body {
      overscroll-behavior-y: none;
    }

    * {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Global text selection */
    ::selection {
      background: #2563EB;
      color: #ffffff;
    }

    /* Focus ring */
    :focus-visible {
      outline: 2px solid #2563EB;
      outline-offset: 2px;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #ffffff;
      border-left: 1px solid #e5e7eb;
    }

    ::-webkit-scrollbar-thumb {
      background: #000000;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #2563EB;
    }

    /* Smooth image loading */
    img {
      transition: opacity 0.3s ease;
    }

    /* Button and interactive element cursor */
    button, [role="button"] {
      cursor: pointer;
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/"
  }
}
</script>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
